<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordNest — your dictionary, your desk</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A93226">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --cream: #F4EEDF;
    --paper: #EBE0C6;
    --paper-dark: #DED0AC;
    --red: #A93226;
    --red-dark: #7E241A;
    --ink: #2B2317;
    --gold: #C8963F;
    --clip: #4A4438;
    --green: #4C7A4C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    background-image:
      linear-gradient(var(--paper-dark) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-dark) 1px, transparent 1px);
    background-size: 26px 26px;
    background-position: -1px -1px;
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 26px 18px 90px; }

  /* ---- header ---- */
  header {
    background: var(--red);
    border: 3px solid var(--ink);
    border-radius: 4px;
    padding: 18px 22px;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 5px 5px 0 var(--ink);
  }
  header .title-block h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 5.5vw, 34px);
    color: var(--cream);
    margin: 0;
    letter-spacing: -0.5px;
  }
  header .title-block .tag {
    font-family: 'Work Sans', sans-serif; font-style: italic;
    font-size: 17px;
    color: var(--paper);
    margin-top: 2px;
  }
  .fuel {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--cream);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 800;
    font-size: 14px;
    color: var(--ink);
    white-space: nowrap;
  }
  .fuel svg { width: 18px; height: 18px; }

  /* ---- breadcrumb / back ---- */
  .backbar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  .backbar button {
    font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 13px;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    padding: 7px 14px; cursor: pointer;
  }
  @media (hover: hover) { .backbar button:hover { background: var(--paper-dark); } }
  .crumb { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: var(--red-dark); }

  /* ---- paper card, torn top ---- */
  .paper-card {
    position: relative;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 3px;
    padding: 26px 22px 22px;
    margin-bottom: 20px;
    box-shadow: 6px 6px 0 rgba(43,35,23,0.18);
  }
  .paperclip {
    position: absolute;
    top: -16px;
    width: 30px;
    height: 46px;
  }
  .paperclip.left { left: 22px; transform: rotate(-8deg); }
  .paperclip.right { right: 22px; transform: rotate(7deg); }

  /* ---- home: category folders ---- */
  .home-title {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px;
    margin: 6px 4px 14px; color: var(--ink);
  }
  .folder-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 480px) { .folder-grid { grid-template-columns: 1fr; } }
  .folder-card {
    cursor: pointer;
    border: 3px solid var(--ink);
    border-radius: 4px 14px 4px 4px;
    padding: 18px 16px 16px;
    position: relative;
    overflow: hidden;
    min-height: 128px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    box-shadow: 5px 5px 0 rgba(43,35,23,0.2);
    transition: transform 0.12s ease;
  }
  @media (hover: hover) { .folder-card:hover { transform: translateY(-3px); } }
  .folder-card .fc-tab {
    position: absolute; top: 0; left: 16px;
    width: 46px; height: 12px;
    background: inherit;
    border: 3px solid var(--ink);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    transform: translateY(-100%);
  }
  .folder-card .fc-icon { font-size: 26px; margin-bottom: 6px; }
  .folder-card .fc-name {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px;
    position: relative; z-index: 1;
  }
  .folder-card .fc-sub {
    font-family: 'Work Sans', sans-serif; font-size: 12.5px; font-weight: 600;
    position: relative; z-index: 1; margin-top: 2px; opacity: 0.85;
  }
  .fc-1 { background: #F1D9A8; }
  .fc-2 { background: #D9C7E8; }
  .fc-3 { background: #C9DFC3; }
  .fc-4 { background: #EAB8A8; }

  /* ---- forms ---- */
  .field-label {
    font-family: 'Work Sans', sans-serif; font-weight: 800; font-size: 12.5px;
    text-transform: none; color: var(--red-dark); margin-bottom: 6px; display: block;
  }
  input, textarea, select {
    font-family: 'Work Sans', sans-serif; font-size: 15px;
    padding: 11px 13px; border: 2px solid var(--clip); border-radius: 8px;
    background: var(--cream); width: 100%; outline: none;
    box-sizing: border-box; -webkit-appearance: none; appearance: none;
    min-width: 0;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--red); }
  /* Yandex Browser (and some Chromium forks) apply their own autofill background
     and can otherwise leave a mismatched fill color on inputs */
  input:-webkit-autofill, input:-webkit-autofill:focus, input:-webkit-autofill:hover {
    -webkit-box-shadow: 0 0 0 1000px var(--cream) inset;
    -webkit-text-fill-color: var(--ink);
    caret-color: var(--ink);
    transition: background-color 9999s ease-in-out 0s;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .btn {
    font-family: 'Work Sans', sans-serif; font-weight: 800; font-size: 14px;
    border: 2.5px solid var(--ink); border-radius: 8px; padding: 11px 18px;
    cursor: pointer; background: var(--gold); color: var(--ink);
    box-sizing: border-box; min-width: 0;
  }
  @media (hover: hover) { .btn:hover { filter: brightness(1.05); } }
  .btn.ghost { background: var(--cream); }
  .btn.red { background: var(--red); color: var(--cream); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-row > * { min-width: 0; }

  /* ---- word list ---- */
  .word-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--cream); border: 2px solid var(--paper-dark); border-radius: 8px;
    padding: 11px 14px; margin-bottom: 8px;
  }
  .word-row .term { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; }
  .word-row .def { font-size: 12.5px; color: #6b5a3a; margin-top: 1px; }
  .word-row .topic-badge {
    display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 8px;
    border-radius: 999px; background: var(--paper-dark); margin-top: 4px; color: var(--red-dark);
  }
  .word-row button.remove { background: none; border: none; color: var(--red); font-size: 17px; cursor: pointer; }
  .empty { text-align: center; padding: 26px 10px; color: #927e52; font-size: 13.5px; font-family: 'Work Sans', sans-serif; font-style: italic; font-size: 20px; }

  /* ---- topic detail ---- */
  .topic-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  }
  .topic-header h2 { font-family: 'Space Grotesk', sans-serif; margin: 0; font-size: 22px; }

  /* ---- game session ---- */
  .session-bar {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    font-family: 'Work Sans', sans-serif; font-size: 12.5px; font-weight: 800; color: var(--red-dark);
  }
  .flip-card { perspective: 1000px; height: 210px; cursor: pointer; margin-bottom: 18px; }
  .flip-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
  .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
  .flip-face {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    border-radius: 6px; border: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    text-align: center; padding: 20px;
  }
  .flip-front { background: var(--red); color: var(--cream); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 25px; }
  .flip-back { background: var(--paper); color: var(--ink); transform: rotateY(180deg); font-size: 17px; font-weight: 600; }
  .flip-hint { font-size: 12px; opacity: 0.8; margin-top: 10px; font-family: 'Work Sans', sans-serif; font-style: italic; font-weight: 700; font-size: 16px; }
  .game-controls { display: flex; gap: 10px; justify-content: center; }
  .game-controls button {
    font-family: 'Work Sans', sans-serif; font-weight: 800; font-size: 13px;
    border: 2.5px solid var(--ink); border-radius: 999px; padding: 10px 20px; cursor: pointer;
  }
  .btn-again { background: var(--cream); }
  .btn-know { background: var(--gold); }

  .mc-question { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 16px; color: var(--red-dark); }
  .mc-options { display: flex; flex-direction: column; gap: 9px; }
  .mc-option {
    font-size: 14.5px; font-weight: 600; background: var(--cream);
    border: 2.5px solid var(--paper-dark); border-radius: 8px; padding: 13px; cursor: pointer; text-align: left;
  }
  @media (hover: hover) { .mc-option:hover { border-color: var(--red); } }
  .mc-option.correct { background: #d7ecd2; border-color: var(--green); }
  .mc-option.wrong { background: #f0d3ce; border-color: var(--red); }

  .feedback { text-align: center; font-family: 'Work Sans', sans-serif; font-style: italic; font-size: 24px; color: var(--red-dark); min-height: 30px; }
  .session-done { text-align: center; padding: 24px 10px; }
  .session-done h2 { font-family: 'Space Grotesk', sans-serif; color: var(--red-dark); }

  .loading { text-align: center; padding: 20px; color: #927e52; font-family: 'Work Sans', sans-serif; font-style: italic; font-size: 20px; }
  .coffee-icon { flex-shrink: 0; }

  /* ---- login screen ---- */
  .login-wrap { max-width: 380px; margin: 60px auto; text-align: center; }
  .login-wrap h1 { font-family: 'Space Grotesk', sans-serif; font-size: 32px; color: var(--red-dark); margin-bottom: 4px; }
  .login-wrap .tag { font-family: 'Work Sans', sans-serif; font-style: italic; font-size: 18px; color: #7a6640; margin-bottom: 24px; }
  .login-wrap input { text-align: center; margin-bottom: 12px; }
  .signout-btn {
    font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 12px;
    background: none; border: 2px solid var(--ink); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; color: var(--ink);
  }
  .lang-toggle { display: flex; gap: 4px; }
  .lang-btn {
    font-family: 'Work Sans', sans-serif; font-weight: 800; font-size: 11px;
    background: var(--cream); border: 2px solid var(--ink); border-radius: 999px;
    padding: 4px 9px; cursor: pointer; color: var(--ink); opacity: 0.6;
  }
  .lang-btn.active { opacity: 1; background: var(--gold); }
  .focus-menu-item {
    font-family: 'Work Sans', sans-serif; font-size: 13.5px; font-weight: 600;
    padding: 10px 14px; cursor: pointer; white-space: nowrap; color: var(--ink);
  }
  .focus-menu-item:not(:last-child) { border-bottom: 1.5px solid var(--paper-dark); }
  @media (hover: hover) { .focus-menu-item:hover { background: var(--paper-dark); } }

  /* ---- mode picker ---- */
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 480px) { .mode-grid { grid-template-columns: 1fr; } }
  .mode-btn {
    font-family: 'Work Sans', sans-serif; text-align: left; cursor: pointer;
    background: var(--cream); border: 2.5px solid var(--ink); border-radius: 10px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;
  }
  @media (hover: hover) { .mode-btn:hover { background: var(--paper-dark); } }
  .mode-btn .mode-emoji { font-size: 20px; }
  .mode-btn .mode-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14.5px; }
  .mode-btn .mode-note { font-size: 11.5px; color: #7a6640; font-weight: 600; }
  .mode-btn.adhd { border-color: var(--red); }
  .mode-btn.adhd .mode-note { color: var(--red-dark); }

  /* ---- typing practice ---- */
  #type-input { margin: 14px 0 6px; text-align: center; font-size: 17px; font-weight: 700; }

  /* ---- speed round timer ---- */
  .timer-track {
    height: 8px; background: var(--paper-dark); border-radius: 999px; overflow: hidden;
    border: 2px solid var(--ink); margin-bottom: 14px;
  }
  .timer-fill { height: 100%; background: var(--red); width: 100%; transition: width 0.1s linear; }

  /* ---- match game ---- */
  .match-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .match-card {
    min-height: 76px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 8px; font-size: 12.5px; font-weight: 700;
    background: var(--cream); border: 2.5px solid var(--paper-dark); border-radius: 8px;
    cursor: pointer; line-height: 1.25;
  }
  .match-card.selected { border-color: var(--gold); background: #fdf1d6; }
  .match-card.wrong { border-color: var(--red); background: #f0d3ce; }
  .match-card.matched { background: transparent; border-color: transparent; cursor: default; opacity: 0; pointer-events: none; }
</style>
</head>

function tr(key) {
  return (STRINGS[currentLang] && STRINGS[currentLang][key]) || STRINGS.en[key] || key;
}
function setLang(lang) {
  currentLang = lang;
  try { localStorage.setItem('wordnest_lang', lang); } catch(e){}
  applyStaticLang();
  if (state.authView === 'login' || state.authView === 'sent') { renderLoginScreen(); }
  else if (state.authView === 'setup') { renderSetupNeeded(); }
  else if (state.authView === 'app') { render(); }
}
function applyStaticLang() {
  document.documentElement.lang = currentLang;
  const tagEls = document.querySelectorAll('.js-app-tag');
  tagEls.forEach(el => el.textContent = tr('app.tag'));
  const signoutEl = document.getElementById('signout-label');
  if (signoutEl) signoutEl.textContent = tr('app.signout');
  const focusBtn = document.getElementById('focus-sound-btn');
  if (focusBtn) focusBtn.title = tr('focusSound.title');
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });
}
function langToggleHtml() {
  return `<div class="lang-toggle">
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
  </div>`;
}

/* ---------- AUTH ---------- */
// Supabase Auth requires an email-shaped identifier internally, but the user
// never sees this — they only ever type a username. We convert it to a fake,
// never-delivered address on a domain nobody owns.
const FAKE_EMAIL_DOMAIN = 'wordnest.local';
function usernameToFakeEmail(username) {
  const clean = username.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
  return `${clean}@${FAKE_EMAIL_DOMAIN}`;
}
function isValidUsername(username) {
  const clean = username.trim().toLowerCase();
  return /^[a-z0-9_.-]{3,30}$/.test(clean);
}

function renderLoginScreen() {
  const app = document.getElementById('app');
  document.getElementById('app-header').style.display = 'none';
  const langRow = `<div style="display:flex; justify-content:center; margin-bottom:14px;">${langToggleHtml()}</div>`;
  const mode = state.authFormMode || 'signin';

  app.innerHTML = `
    <div class="login-wrap">
      ${langRow}
      <h1>WordNest</h1>
      <div class="tag">${tr('login.tag')}</div>
      <div class="paper-card">
        <div class="btn-row" style="margin-bottom:14px;">
          <button class="btn ${mode==='signin'?'red':'ghost'}" style="flex:1;" onclick="setAuthFormMode('signin')">${tr('login.signInTab')}</button>
          <button class="btn ${mode==='signup'?'red':'ghost'}" style="flex:1;" onclick="setAuthFormMode('signup')">${tr('login.signUpTab')}</button>
        </div>
        <div class="stack">
          <input id="login-username" type="text" autocapitalize="off" autocorrect="off" placeholder="${tr('login.usernamePlaceholder')}" />
          <input id="login-password" type="password" placeholder="${tr('login.passwordPlaceholder')}" onkeydown="if(event.key==='Enter') submitAuthForm()" />
          <button class="btn red" onclick="submitAuthForm()">${mode==='signin'?tr('login.signInBtn'):tr('login.signUpBtn')}</button>
        </div>
        ${mode==='signup' ? `<p style="font-family:'Work Sans',sans-serif; font-style:italic; font-size:13.5px; color:#7a6640; margin:10px 0 0;">${tr('login.usernameHint')}</p>` : ''}
      </div>
      <div id="login-error" style="color:var(--red); font-size:13px; margin-top:8px;"></div>
    </div>`;
  applyStaticLang();
}

function setAuthFormMode(mode) {
  state.authFormMode = mode;
  renderLoginScreen();
}

async function submitAuthForm() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  if (errEl) errEl.textContent = '';
  if (!username.trim() || !password) { if (errEl) errEl.textContent = tr('login.fillBothFields'); return; }
  if (!isValidUsername(username)) { if (errEl) errEl.textContent = tr('login.usernameInvalid'); return; }
  if (password.length < 6) { if (errEl) errEl.textContent = tr('login.passwordTooShort'); return; }

  const fakeEmail = usernameToFakeEmail(username);
  const mode = state.authFormMode || 'signin';
  try {
    if (mode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email: fakeEmail, password });
      if (error) {
        if (errEl) errEl.textContent = /already registered|already exists/i.test(error.message) ? tr('login.usernameTaken') : error.message;
        return;
      }
      if (!data.session) {
        // Project still has "Confirm email" turned on for a domain that can never receive mail.
        if (errEl) errEl.textContent = tr('login.confirmEmailStillOn');
        return;
      }
      // signed in immediately — onAuthStateChange handles the rest
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: fakeEmail, password });
      if (error) {
        if (errEl) errEl.textContent = /invalid login credentials/i.test(error.message) ? tr('login.wrongCredentials') : error.message;
        return;
      }
      // onAuthStateChange handles the rest
    }
  } catch (e) {
    if (errEl) errEl.textContent = tr('login.couldNotSend');
  }
}

async function signOut() {
  clearSpeedTimer();
  stopFocusSound();
  try { await sb.auth.signOut(); } catch(e){}
  state.currentUser = null;
  state.authView = 'login';
  state.words = []; state.topics = []; state.sessionLog = []; state.activityDates = [];
  state.streak = 0; state.view = 'home'; state.navStack = [];
  renderLoginScreen();
}

function renderSetupNeeded() {
  document.getElementById('app-header').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div style="display:flex; justify-content:center; margin-bottom:14px;">${langToggleHtml()}</div>
      <h1>WordNest</h1>
      <div class="tag">${tr('setup.tag')}</div>
      <div class="paper-card">
        <p style="font-size:15px;">${tr('setup.body')}</p>
      </div>
    </div>`;
  applyStaticLang();
}

async function initAuth() {
  if (!SUPABASE_CONFIGURED || !sb) { state.authView = 'setup'; renderSetupNeeded(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) {
    state.currentUser = session.user;
    state.authView = 'app';
    document.getElementById('app-header').style.display = 'flex';
    document.getElementById('header-lang-toggle').innerHTML = langToggleHtml();
    applyStaticLang();
    await loadAll();
  } else {
    state.authView = 'login';
    renderLoginScreen();
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session && session.user) {
      state.currentUser = session.user;
      state.authView = 'app';
      document.getElementById('app-header').style.display = 'flex';
      document.getElementById('header-lang-toggle').innerHTML = langToggleHtml();
      applyStaticLang();
      await loadAll();
    } else if (event === 'SIGNED_OUT') {
      state.currentUser = null;
      state.authView = 'login';
      renderLoginScreen();
    }
  });
}

/* ---------- DATA MAPPING (local camelCase <-> db snake_case) ---------- */
function wordToRow(w) {
  return { id: w.id, user_id: state.currentUser.id, topic_id: w.topicId || null, term: w.term, def: w.def, emoji: w.emoji || null, image: w.image || null, mastery: w.mastery || 0 };
}
function rowToWord(r) {
  return { id: r.id, term: r.term, def: r.def, emoji: r.emoji || '', image: r.image || null, topicId: r.topic_id, mastery: r.mastery || 0 };
}
function topicToRow(t) {
  return { id: t.id, user_id: state.currentUser.id, name: t.name };
}
function rowToTopic(r) {
  return { id: r.id, name: r.name };
}

async function loadAll() {
  try {
    const { data, error } = await sb.from('topics').select('*').order('created_at');
    state.topics = error || !data ? [] : data.map(rowToTopic);
  } catch(e) { state.topics = []; }
  try {
    const { data, error } = await sb.from('words').select('*').order('created_at', { ascending: false });
    state.words = error || !data ? [] : data.map(rowToWord);
  } catch(e) { state.words = []; }
  try {
    const { data, error } = await sb.from('user_stats').select('*').eq('user_id', state.currentUser.id).maybeSingle();
    state.streak = (!error && data) ? (data.streak || 0) : 0;
  } catch(e) { state.streak = 0; }
  try {
    const { data, error } = await sb.from('activity_dates').select('date');
    state.activityDates = error || !data ? [] : data.map(r => r.date);
  } catch(e) { state.activityDates = []; }
  try {
    const { data, error } = await sb.from('session_log').select('*');
    state.sessionLog = error || !data ? [] : data.map(r => ({ date: r.date, mode: r.mode, mood: r.mood, correct: r.correct, total: r.total }));
  } catch(e) { state.sessionLog = []; }
  state.loaded = true;

  if (state.words.length === 0 && state.topics.length === 0) {
    const t1 = uid();
    const seedTopic = { id: t1, name: 'Study Habits' };
    const seedWords = [
      { id: uid(), term: 'hyperfocus', def: 'a state of intense, absorbed concentration on one thing', topicId: t1, mastery: 0 },
      { id: uid(), term: 'chunking', def: 'grouping information into smaller units to make it easier to remember', topicId: t1, mastery: 0 },
    ];
    state.topics = [seedTopic];
    state.words = seedWords;
    try { await sb.from('topics').insert(topicToRow(seedTopic)); } catch(e){}
    try { await sb.from('words').insert(seedWords.map(wordToRow)); } catch(e){}
  }
  render();
}

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  // fallback for very old browsers
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function visualAnchor(w, size) {
  if (w.image) return `<img src="${w.image}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:8px;border:2px solid var(--ink);vertical-align:middle;margin-right:7px;" />`;
  if (w.emoji) return `<span style="margin-right:6px;">${esc(w.emoji)}</span>`;
  return '';
}
function flipAnchorHtml(w) {
  if (w.image) return `<img src="${w.image}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--cream);margin-bottom:6px;" />`;
  if (w.emoji) return `<div style="font-size:32px;margin-bottom:6px;">${esc(w.emoji)}</div>`;
  return '';
}

function handleImageSelect(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 160;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
      else if (h >= w && h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      state.createDraftImage = dataUrl;
      const preview = document.getElementById('image-preview');
      if (preview) {
        preview.innerHTML = `<img src="${dataUrl}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;border:2px solid var(--ink);" /><button type="button" onclick="clearDraftImage()" style="background:none;border:none;color:var(--red);font-weight:800;font-size:12px;cursor:pointer;">${tr('create.removeImg')}</button>`;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- FOCUS SOUND (self-contained, no external audio — noise + synthesized lofi ambient) ---------- */
let focusCtx = null;
let focusNodes = [];   // all live audio nodes to disconnect on stop
let focusTimers = [];  // all setInterval/setTimeout ids to clear on stop
state.focusSoundMode = 'off'; // 'off' | 'noise' | 'lofi'

function stopFocusSound() {
  focusTimers.forEach(id => clearInterval(id));
  focusTimers = [];
  focusNodes.forEach(n => { try { n.stop && n.stop(); } catch(e){} try { n.disconnect(); } catch(e){} });
  focusNodes = [];
  if (focusCtx) { try { focusCtx.close(); } catch(e){} focusCtx = null; }
  state.focusSoundMode = 'off';
}

function startNoiseSound() {
  stopFocusSound();
  try {
    focusCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 2 * focusCtx.sampleRate;
    const buffer = focusCtx.createBuffer(1, bufferSize, focusCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = focusCtx.createBufferSource();
    src.buffer = buffer; src.loop = true;
    const gain = focusCtx.createGain();
    gain.gain.value = 0.045;
    src.connect(gain).connect(focusCtx.destination);
    src.start(0);
    focusNodes.push(src, gain);
    state.focusSoundMode = 'noise';
  } catch(e) { console.error('noise sound failed', e); }
}

function startLofiSound() {
  stopFocusSound();
  try {
    focusCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = focusCtx;

    // soft vinyl-style texture bed (filtered, quiet noise)
    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const crackle = ctx.createBufferSource();
    crackle.buffer = buffer; crackle.loop = true;
    const crackleFilter = ctx.createBiquadFilter();
    crackleFilter.type = 'highpass'; crackleFilter.frequency.value = 3000;
    const crackleGain = ctx.createGain();
    crackleGain.gain.value = 0.015;
    crackle.connect(crackleFilter).connect(crackleGain).connect(ctx.destination);
    crackle.start(0);
    focusNodes.push(crackle, crackleFilter, crackleGain);

    // slow, warm chord pad (Cmaj7-ish: C4 E4 G4 B4), gently detuned
    const padFreqs = [261.63, 329.63, 392.00, 493.88];
    padFreqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.detune.value = (i % 2 === 0) ? -4 : 4;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 900;
      const g = ctx.createGain();
      g.gain.value = 0;
      osc.connect(lp).connect(g).connect(ctx.destination);
      osc.start(0);
      // slow fade in for a gentle pad swell
      g.gain.linearRampToValueAtTime(0.028, ctx.currentTime + 3 + i * 0.4);
      focusNodes.push(osc, lp, g);
    });

    // soft, muffled rhythmic thump every ~1.4s (lofi-style soft kick)
    const playThump = () => {
      if (!focusCtx) return;
      const t = focusCtx.currentTime;
      const osc = focusCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(90, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.18);
      const g = focusCtx.createGain();
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      osc.connect(g).connect(focusCtx.destination);
      osc.start(t); osc.stop(t + 0.25);
    };
    playThump();
    const thumpId = setInterval(playThump, 1400);
    focusTimers.push(thumpId);

    state.focusSoundMode = 'lofi';
  } catch(e) { console.error('lofi sound failed', e); }
}

function setFocusSound(mode) {
  if (mode === 'noise') startNoiseSound();

/* ---------- SUCCESS CHIME (short, pleasant, on correct answers) ---------- */
let chimeCtx = null;
function playCorrectChime() {
  try {
    if (!chimeCtx) chimeCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = chimeCtx;
    const notes = [523.25, 659.25]; // C5, E5 — a quick bright little "ding"
    notes.forEach((freq, i) => {
      const t = ctx.currentTime + i * 0.09;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      osc.connect(g).connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.4);
    });
  } catch(e) { /* ignore — sound is a nice-to-have, never block the app on it */ }
}

function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function captureContext(view) {
  if (view === 'topicDetail') return { activeTopicId: state.activeTopicId };
  if (view === 'gamePicker') return { pendingPool: state.pendingPool, pendingLabel: state.pendingLabel, pendingInfinite: state.pendingInfinite };
  if (view === 'create') return { createDraftTopicId: state.createDraftTopicId };
  return {};
}
function pushHistoryIfNeeded(newView) {
  if (state.view !== newView) {
    state.navStack.push({ view: state.view, ctx: captureContext(state.view) });
  }
}
function goto(view, extra) {
  clearSpeedTimer();
  pushHistoryIfNeeded(view);
  state.view = view;
  state.session = null;
  if (extra) Object.assign(state, extra);
  render();
}
function goBack() {
  clearSpeedTimer();
  let prev = null;
  while (state.navStack.length) {
    const candidate = state.navStack.pop();
    if (candidate.view !== 'session') { prev = candidate; break; }
  }
  state.session = null;
  if (!prev) { state.view = 'home'; render(); return; }
  state.view = prev.view;
  Object.assign(state, prev.ctx);
  render();
}

  clearSpeedTimer();

const SPEED_SECONDS = 7;
const TEST_QTYPES = ['mc-def', 'mc-term', 'type'];

function freshSessionBase() {
  return { correct: 0, mcSelected: null, typedAnswer: '', typeChecked: false, mistakes: [], totalAnswered: 0, consecutiveMistakes: 0, showBreakPrompt: false, forceEnd: false, moodLogged: false, roundsCompleted: 0 };
}

function startSession(mode) {
  const pool = state.pendingPool || [];
  const infinite = !!state.pendingInfinite;
  if ((mode === 'mc' || mode === 'speed' || mode === 'test') && pool.length < 4) { alert(tr('picker.needFour')); return; }
  if (pool.length < 1) { alert(tr('picker.empty')); return; }

  if (mode === 'match') { startMatchSession(pool); return; }
  if (mode === 'test') { startTestSession(pool, infinite); return; }

  pushHistoryIfNeeded('session');
  state.session = Object.assign(freshSessionBase(), { mode, queue: shuffle(pool), index: 0, flipped: false, label: state.pendingLabel, infinite });
  state.view = 'session';
  render();
  if (mode === 'speed') startSpeedTimer();
}

function markKnown(known) {
  const s = state.session;
  const w = s.queue[s.index];
  const target = state.words.find(x => x.id === w.id);
  if (target) target.mastery = Math.max(0, target.mastery + (known ? 1 : -1));
  s.totalAnswered = (s.totalAnswered || 0) + 1;
  if (known) { state.streak++; saveStreak(); s.correct++; noteCorrect(s); playCorrectChime(); }
  else { s.mistakes.push(w); noteWrong(s); }
  updateWordMasteryDb(target);
  nextCard();
}
function nextCard() {
  state.session.index++;
  state.session.flipped = false;
  state.session.mcSelected = null;
  state.session.typedAnswer = '';
  state.session.typeChecked = false;
  render();
  if (state.session && state.session.mode === 'speed' && !state.session.showBreakPrompt) startSpeedTimer();
}
function toggleFlip() { state.session.flipped = !state.session.flipped; render(); }

// call when s.index has reached s.queue.length inside a render* function.
// returns true if the caller should keep rendering the (now-looped) current card,
// false if the caller should show the session-done screen.
function advanceOrLoop(s) {
  if (s.infinite) {
    s.queue = shuffle(s.queue);
    if (s.mode === 'test') {
      s.queue = s.queue.map(item => ({ word: item.word, qtype: TEST_QTYPES[Math.floor(Math.random() * TEST_QTYPES.length)] }));
    }
    s.index = 0;
    s.roundsCompleted = (s.roundsCompleted || 0) + 1;
    return true;
  }
  return false;
}
function infiniteFlag(s) {
  return s.infinite ? `<button class="btn-again" style="border-radius:999px; padding:6px 14px; font-size:12px;" onclick="endInfiniteSession()">${tr('session.doneForNow')}</button>` : '';
}
function endInfiniteSession() {
  clearSpeedTimer();
  const s = state.session;
  if (!s) return;
  s.forceEnd = true;
  render();
}

/* ---------- TYPING PRACTICE ---------- */
function renderType() {
  const s = state.session;
  if (s.forceEnd) return renderSessionDone();
  if (s.showBreakPrompt) return renderBreakPrompt();
  if (s.index >= s.queue.length) {
    if (!advanceOrLoop(s)) { clearSpeedTimer(); return renderSessionDone(); }
  }
  const w = s.queue[s.index];
  const checked = s.typeChecked;
  let resultHtml = '';
  if (checked) {
    const isCorrect = s.typedAnswer.trim().toLowerCase() === w.term.trim().toLowerCase();
    resultHtml = `<p class="feedback">${isCorrect ? tr('session.exactlyRight') : `${tr('session.closeItWas')} "${esc(w.term)}"`}</p>`;
  }
  return `
    <div class="paper-card">
      <div class="session-bar"><span>word ${s.index+1} / ${s.queue.length}${s.infinite ? ' · round '+(s.roundsCompleted+1) : ''} — ${esc(s.label||'')}</span><span>🔥 ${state.streak}</span></div>
      <div style="text-align:center; margin-top:4px;">${flipAnchorHtml(w)}</div>

function submitTyped() {

/* ---------- SPEED ROUND ---------- */
function startSpeedTimer() {
  clearSpeedTimer();
  const s = state.session;
  if (!s || s.mode !== 'speed' || s.index >= s.queue.length) return;
  const startedAt = Date.now();
  state.speedTimerId = setInterval(() => {
    const elapsed = (Date.now() - startedAt) / 1000;
    const remaining = Math.max(0, SPEED_SECONDS - elapsed);
    const fill = document.getElementById('timer-fill');
    if (fill) fill.style.width = (remaining / SPEED_SECONDS * 100) + '%';
    if (remaining <= 0) {
      clearSpeedTimer();
      if (state.session && state.session.mcSelected === null) speedTimeout();
    }
  }, 100);
}
function clearSpeedTimer() {
  if (state.speedTimerId) { clearInterval(state.speedTimerId); state.speedTimerId = null; }
}
function speedTimeout() {
  const s = state.session;
  if (!s) return;
  const w = s.queue[s.index];
  s.mcSelected = -1;
  s.mistakes.push(w);
  s.totalAnswered = (s.totalAnswered || 0) + 1;
  noteWrong(s);
  const target = state.words.find(x => x.id === w.id);
  if (target) target.mastery = Math.max(0, target.mastery - 1);
  updateWordMasteryDb(target);
  render();
  setTimeout(() => { if (state.session) nextCard(); }, 900);
}
function speedAnswerByIndex(idx) {
  const s = state.session;
  if (s.mcSelected !== null) return;
  clearSpeedTimer();
  const w = s.queue[s.index];
  const selectedText = s.currentOptions[idx];
  s.mcSelected = idx;
  const isCorrect = selectedText === w.def;
  s.totalAnswered = (s.totalAnswered || 0) + 1;
  if (isCorrect) { state.streak++; saveStreak(); s.correct++; noteCorrect(s); playCorrectChime(); }
  else { s.mistakes.push(w); noteWrong(s); }
  const target = state.words.find(x => x.id === w.id);
  if (target) target.mastery = Math.max(0, target.mastery + (isCorrect ? 1 : -1));
  updateWordMasteryDb(target);
  render();
  setTimeout(() => { if (state.session) nextCard(); }, 900);
}
function renderSpeed() {
  const s = state.session;
  if (s.forceEnd) { clearSpeedTimer(); return renderSessionDone(); }
  if (s.showBreakPrompt) { clearSpeedTimer(); return renderBreakPrompt(); }
  if (s.index >= s.queue.length) {
    if (advanceOrLoop(s)) { startSpeedTimer(); }
    else { clearSpeedTimer(); return renderSessionDone(); }
  }
  const w = s.queue[s.index];
  if (!s.currentOptions || s.currentWordId !== w.id) {
    s.currentOptions = generateMCOptions(w, s.queue);
    s.currentWordId = w.id;
  }
  const selected = s.mcSelected;
  const optionsHtml = s.currentOptions.map((opt, idx) => {
    let cls = 'mc-option';
    if (selected !== null) {
      if (opt === w.def) cls += ' correct';
      else if (idx === selected) cls += ' wrong';
    }
    return `<div class="${cls}" onclick="speedAnswerByIndex(${idx})">${esc(opt)}</div>`;
  }).join('');
  return `
    <div class="paper-card">
      <div class="session-bar"><span>${tr('session.question')} ${s.index+1} / ${s.queue.length}${s.infinite ? ' · '+tr('session.round')+' '+(s.roundsCompleted+1) : ''} — ${esc(s.label||'')}</span><span>🔥 ${state.streak}</span></div>

const MATCH_BATCH_SIZE = 6;

function startMatchSession(pool) {
  pushHistoryIfNeeded('session');
  state.session = {
    mode: 'match', allWords: shuffle(pool), batchIndex: 0, batchSize: MATCH_BATCH_SIZE,
    cards: [], selected: [], wrongFlash: [], matchedCount: 0, totalPairs: 0,
    label: state.pendingLabel, mistakes: [],
    wrongAttempts: 0, consecutiveMistakes: 0, showBreakPrompt: false, moodLogged: false,
    totalAnswered: 0, correct: 0, activityRecorded: false,
  };
  loadMatchBatch(state.session);
  state.view = 'session';
  render();
}
function loadMatchBatch(s) {
  const start = s.batchIndex * s.batchSize;
  const batchWords = s.allWords.slice(start, start + s.batchSize);
  const cards = [];
  batchWords.forEach(w => {
    cards.push({ cardId: uid(), wordId: w.id, type: 'term', text: w.term, matched: false });
    cards.push({ cardId: uid(), wordId: w.id, type: 'def', text: w.def, matched: false });
  });
  s.cards = shuffle(cards);
  s.selected = [];
  s.wrongFlash = [];
  s.matchedCount = 0;
  s.totalPairs = batchWords.length;
}
function nextMatchBatch() {
  const s = state.session;
  if (!s) return;
  s.batchIndex++;
  loadMatchBatch(s);
  render();
}
function matchClick(cardId) {
  const s = state.session;
  if (s.showBreakPrompt || s.wrongFlash.length) return;
  const card = s.cards.find(c => c.cardId === cardId);
  if (!card || card.matched || s.selected.includes(cardId)) return;
  if (s.selected.length === 0) { s.selected = [cardId]; render(); return; }
  const first = s.cards.find(c => c.cardId === s.selected[0]);
  if (first.wordId === card.wordId && first.type !== card.type) {
    first.matched = true; card.matched = true;
    s.matchedCount++; s.selected = [];
    state.streak++; saveStreak();
    noteCorrect(s);
    playCorrectChime();
    render();
  } else {
    s.wrongFlash = [s.selected[0], cardId];
    s.selected = [];
    s.wrongAttempts++;
    noteWrong(s);
    render();
    setTimeout(() => { s.wrongFlash = []; render(); }, 700);
  }
}
function renderMatch() {
  const s = state.session;
  if (s.showBreakPrompt) return renderBreakPrompt();
  if (s.matchedCount >= s.totalPairs) {
    const doneSoFar = (s.batchIndex + 1) * s.batchSize;
    const hasMore = doneSoFar < s.allWords.length;
    if (hasMore) {
      const remaining = s.allWords.length - doneSoFar;
      return `
        <div class="paper-card session-done">
          <h2>${tr('match.batchCleared')}</h2>
          <p class="feedback">${remaining} ${remaining===1?tr('topics.word'):tr('topics.words')} ${tr('match.leftInSet')}</p>
          <div class="game-controls" style="margin-top:14px; flex-wrap:wrap;">

          </div>
        </div>`;
    }
    if (!s.activityRecorded) { s.activityRecorded = true; recordActivityToday(); }
    s.correct = s.allWords.length;
    s.totalAnswered = s.allWords.length + s.wrongAttempts;
    return `
      <div class="paper-card session-done">

    return `<div class="${cls}" onclick="matchClick('${c.cardId}')">${c.matched ? '' : esc(c.text)}</div>`;
  }).join('');
  return `
    <div class="paper-card">
      <div class="session-bar"><span>${tr('match.batch')} ${s.batchIndex+1} — ${tr('match.matched')} ${s.matchedCount} / ${s.totalPairs} — ${esc(s.label||'')}</span><span>🔥 ${state.streak}</span></div>
      <div class="match-grid">${cardsHtml}</div>
    </div>`;
}

function generateMCOptions(correctWord, pool) {
  return generateOptionsFor(correctWord, pool, 'def');

function generateOptionsFor(correctWord, pool, field) {
  // field: 'def' or 'term'
  let others = (pool || []).filter(w => w.id !== correctWord.id);
  if (others.length < 3) {
    const sameTopic = state.words.filter(w =>
      w.id !== correctWord.id &&
      w.topicId === correctWord.topicId &&
      !others.some(o => o.id === w.id)
    );
    others = others.concat(sameTopic);
  }
  if (others.length < 3) {
    const rest = state.words.filter(w => w.id !== correctWord.id && !others.some(o => o.id === w.id));
    others = others.concat(rest);
  }
  const seen = new Set();
  const wrongs = [];
  for (const w of shuffle(others)) {
    const val = w[field];
    if (val && val !== correctWord[field] && !seen.has(val)) { seen.add(val); wrongs.push(val); }
    if (wrongs.length >= 3) break;
  }
  return shuffle([correctWord[field], ...wrongs]);
}

function renderMC() {

    if (!advanceOrLoop(s)) return renderSessionDone();
  }
  const w = s.queue[s.index];
  if (!s.currentOptions || s.currentWordId !== w.id) {
    s.currentOptions = generateMCOptions(w, s.queue);
    s.currentWordId = w.id;
  }
  const selected = s.mcSelected;
  const optionsHtml = s.currentOptions.map((opt, idx) => {
    let cls = 'mc-option';
    if (selected !== null) {
      if (opt === w.def) cls += ' correct';
      else if (idx === selected) cls += ' wrong';
    }
    return `<div class="${cls}" onclick="mcAnswerByIndex(${idx})">${esc(opt)}</div>`;
  }).join('');
  return `
    <div class="paper-card">
      <div class="session-bar"><span>${tr('session.question')} ${s.index+1} / ${s.queue.length}${s.infinite ? ' · '+tr('session.round')+' '+(s.roundsCompleted+1) : ''} — ${esc(s.label||'')}</span><span>🔥 ${state.streak}</span></div>
      <div class="mc-question">${visualAnchor(w,26)}${esc(w.term)}</div>
      <div class="mc-options">${optionsHtml}</div>
      ${s.infinite ? `<div class="btn-row" style="justify-content:center; margin-top:10px;">${infiniteFlag(s)}</div>` : ''}
    </div>`;
}

function renderSessionDone() {
  const s = state.session;
  if (!s.activityRecorded) { s.activityRecorded = true; recordActivityToday(); }
  const total = s.totalAnswered || 0;
  const pct = total > 0 ? Math.round((s.correct / total) * 100) : 0;
  const mistakeCount = s.mistakes.length;
  return `
    <div class="paper-card session-done">
      <h2>${tr('done.roundComplete')}</h2>
      <p style="font-size:17px;">${s.correct} / ${total} ${tr('done.correct')} (${pct}%)${s.roundsCompleted ? ` · ${s.roundsCompleted} ${s.roundsCompleted===1?tr('done.loopThrough'):tr('done.loopsThrough')}` : ''}</p>
      <p class="feedback">${pct>=80?tr('done.feedbackHigh'):pct>=50?tr('done.feedbackMid'):tr('done.feedbackLow')}</p>
      <div class="game-controls" style="margin-top:14px; flex-wrap:wrap;">
        <button class="btn-again" onclick="goto('gamePicker')">${tr('match.back')}</button>
        <button class="btn-know" onclick="startSession('${s.mode}')">${tr('match.playAgain')}</button>
        ${mistakeCount > 0 ? `<button class="btn red" style="border-radius:999px; padding:10px 20px;" onclick="reviewMistakes()">${tr('done.reviewMistake')} ${mistakeCount} ${mistakeCount===1?tr('done.mistake'):tr('done.mistakes')}</button>` : ''}
      </div>
      ${renderMoodPicker(s)}
    </div>`;
}

function reviewMistakes() {
  const prev = state.session;
  if (!prev || !prev.mistakes.length) return;
  clearSpeedTimer();
  const pool = prev.mistakes;
  const label = (prev.label || '') + ' — mistakes';
  const mode = prev.mode;

  if (mode === 'test') {
    const queue = shuffle(pool).map(w => ({ word: w, qtype: TEST_QTYPES[Math.floor(Math.random() * TEST_QTYPES.length)] }));
    state.session = Object.assign(freshSessionBase(), { mode, queue, label, infinite: false });
  } else {
    state.session = Object.assign(freshSessionBase(), { mode, queue: shuffle(pool), index: 0, flipped: false, label, infinite: false });
  }
  state.view = 'session';
  render();
  if (mode === 'speed') startSpeedTimer();
}

/* ---------- HOME ---------- */

    <div class="folder-grid">

/* ---------- INSIGHTS ---------- */
function computeModeStats() {
  const stats = {};
  state.sessionLog.forEach(e => {
    if (!stats[e.mode]) stats[e.mode] = { correct: 0, total: 0 };
    stats[e.mode].correct += e.correct;
    stats[e.mode].total += e.total;
  });
  return stats;
}
function computeMoodCounts() {
  const counts = {};
  state.sessionLog.forEach(e => { counts[e.mood] = (counts[e.mood] || 0) + 1; });
  return counts;
}
function computeBestWeekday() {
  const buckets = {};
  state.sessionLog.forEach(e => {
    const day = new Date(e.date + 'T00:00:00').getDay();
    if (!buckets[day]) buckets[day] = { correct: 0, total: 0 };
    buckets[day].correct += e.correct;
    buckets[day].total += e.total;
  });
  let best = null, bestPct = -1;
  Object.keys(buckets).forEach(d => {
    const b = buckets[d];
    if (b.total >= 4) {
      const pct = b.correct / b.total;
      if (pct > bestPct) { bestPct = pct; best = d; }
    }
  });
  return best !== null ? { day: Number(best), pct: Math.round(bestPct * 100) } : null;
}
function renderInsights() {
  const modeNames = { flip: tr('mode.flip.name'), mc: tr('mode.mc.name'), type: tr('mode.type.name'), speed: tr('mode.speed.name'), match: tr('mode.match.name'), test: tr('mode.test.name') };
  const modeStats = computeModeStats();
  const modeKeys = Object.keys(modeStats);
  const modeBars = modeKeys.length ? modeKeys.map(m => {
    const s = modeStats[m];
    const pct = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
    return `
      <div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:3px;">
          <span>${modeNames[m] || m}</span><span>${pct}%</span>
        </div>
        <div class="timer-track" style="margin-bottom:0;"><div class="timer-fill" style="width:${pct}%; background:var(--green);"></div></div>
      </div>`;
  }).join('') : `<div class="empty">${tr('insights.noStats')}</div>`;

  const moodCounts = computeMoodCounts();
  const moodLabels = { energized: tr('mood.energized'), neutral: tr('mood.neutral'), tired: tr('mood.tired'), irritated: tr('mood.irritated') };
  const moodHtml = Object.keys(moodCounts).length
    ? Object.entries(moodCounts).map(([k, v]) => `<span class="topic-badge" style="margin-right:6px; margin-bottom:6px; display:inline-block;">${moodLabels[k] || k} ×${v}</span>`).join('')
    : `<span style="color:#927e52; font-family: 'Work Sans', sans-serif; font-style: italic; font-size:18px;">${tr('insights.noCheckins')}</span>`;

  const bestDay = computeBestWeekday();
  const weekdayKeys = ['weekday.0','weekday.1','weekday.2','weekday.3','weekday.4','weekday.5','weekday.6'];
  const bestDayHtml = bestDay
    ? `<p class="feedback">${tr('insights.bestDay')} ${tr(weekdayKeys[bestDay.day])} (${bestDay.pct}% ${tr('insights.bestDayAvg')})</p>`
    : `<p style="color:#927e52; font-family: 'Work Sans', sans-serif; font-style: italic; font-size:18px; text-align:center;">${tr('insights.needMoreData')}</p>`;

  const days = [];
  const today = new Date();
  for (let i = 34; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const calHtml = days.map(d => {
    const active = state.activityDates.includes(d);
    return `<div title="${d}" style="width:100%; aspect-ratio:1; border-radius:4px; border:1.5px solid var(--ink); background:${active ? 'var(--red)' : 'var(--cream)'};"></div>`;
  }).join('');

  return `
    <div class="paper-card">
      ${paperclipSvg('left')}
      <span class="field-label">${tr('insights.calendar')}</span>
      <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap:5px; margin-bottom:16px;">${calHtml}</div>
      <span class="field-label">${tr('insights.moodFeel')}</span>
      <div style="margin-bottom:16px;">${moodHtml}</div>
      ${bestDayHtml}
    </div>
    <div class="paper-card">
      ${paperclipSvg('right')}
      <span class="field-label">${tr('insights.accuracyByMode')}</span>
      ${modeBars}
    </div>
  `;
}

function startHyperfocus() {
  if (state.words.length === 0) { alert(tr('picker.empty')); return; }
  openGamePicker(state.words, 'Hyperfocus — everything', true);
}

/* ---------- MAIN RENDER ---------- */
function render() {
  document.getElementById('streak-display').textContent = state.streak;
  const app = document.getElementById('app');
  if (!state.loaded) { app.innerHTML = `<div class="loading">${tr('app.loading')}</div>`; return; }

  let backbar = '';
  if (state.view !== 'home') {
    backbar = `<div class="backbar"><button onclick="goBack()">${tr('nav.back')}</button><button onclick="resetToHome()">${tr('nav.home')}</button></div>`;
  }

  let body = '';
  if (state.view === 'home') body = renderHome();
  else if (state.view === 'create') body = renderCreate();
  else if (state.view === 'dictionary') body = renderDictionary();
  else if (state.view === 'topics') body = renderTopics();
  else if (state.view === 'topicDetail') body = renderTopicDetail();
  else if (state.view === 'gamePicker') body = renderGamePicker();
  else if (state.view === 'insights') body = renderInsights();
  else if (state.view === 'session') {
    if (state.session.mode === 'flip') body = renderFlip();
    else if (state.session.mode === 'mc') body = renderMC();
    else if (state.session.mode === 'type') body = renderType();
    else if (state.session.mode === 'speed') body = renderSpeed();
    else if (state.session.mode === 'match') body = renderMatch();
    else if (state.session.mode === 'test') body = renderTest();
  }

  app.innerHTML = backbar + body;
}
